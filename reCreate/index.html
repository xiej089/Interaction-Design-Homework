
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>re-create painting</title>

  <style>
    body {
      margin: 0;
      background-color: #f5f4ee;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
      font-weight: normal;
    }

    p {
      color: #625e5e;
      font-size: 13px;
    }

    .painting {
      position: relative;
      width: 700px;
      height: 700px;
      background-color: #9bb2be;
      margin: 40px auto;
    }

    .shape {
      position: absolute;
    }

    .circle {
      border-radius: 50%;
    }

    .white {
      background-color: #f9f8f1;
    }

    .black {
      background-color: #141416;
    }

    .gray {
      background-color: #50525d;
    }

    .blue {
      background-color: #262aa2;
    }

    .red {
      background-color: #d63731;
    }

  </style>
</head>

<body>
  <p>Sophie Taeuber-Arp</p>

  <div class="painting">


    <div class="shape black circle"
      style="left:-7%; top:7%; width:15%; height:20%;">
    </div>

    <div class="shape black circle"
      style="left:-9%; top:27%; width:18%; height:18%;">

</html>
